# Despliegue del orquestador (api/, FastAPI) al App Service Linux "ai-platform"
# (Balaxys dev). Reemplaza el workflow Node que genero el Deployment Center:
# el proyecto es Python. Ver docs/deploy-azure-dev.md.

name: Build and deploy Python app to Azure Web App - ai-platform (Balaxys dev)

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install and test (sin base de datos ni API de Anthropic)
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
          python -m compileall -q app
          python -m pytest -o addopts="" -q \
            tests/test_mcp_client/test_balaxys_mcp.py \
            tests/test_mcp_client/test_orchestrator_erp.py \
            tests/test_mcp_client/test_erp_only_mode.py

      - name: Package api (sin venv, tests ni .env)
        working-directory: api
        run: |
          zip -qr ../release.zip . \
            -x ".venv/*" "tests/*" ".env" ".env.*" "*.pyc" "*/__pycache__/*" "__pycache__/*" \
               "*.egg-info/*" ".pytest_cache/*" ".ruff_cache/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7ACE9F763385421D90166D7A772830A0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BD585A00F4A34F6CAB1479E42DAC4E1E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C65C6FA23C9F4BBF9602B039470ADC23 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ai-platform'
          slot-name: 'Production'
          package: release.zip
